name: Quality Check
on:
  push:
  pull_request:
    branches:
      - main
jobs:
  quality-check:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_DISCORD_CLIENT_ID: ${{ secrets.BETTER_AUTH_DISCORD_CLIENT_ID }}
      BETTER_AUTH_DISCORD_CLIENT_SECRET: ${{ secrets.BETTER_AUTH_DISCORD_CLIENT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Unit Tests
      #   run: npm run test
